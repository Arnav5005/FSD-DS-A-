<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p id="demo"></p>
    <script>
        let n=Number(prompt("Enter number: "));
        let i=1;
        let output="";
        while (i<=10) {
            output+=`${n} X ${i} = ${n*i}<br>`;
            i++;
        }
      document.getElementById("demo").innerHTML=output;
    </script>
  </body>
</html>
